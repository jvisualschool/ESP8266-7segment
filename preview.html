<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAX7219 + OLED Live Preview</title>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #1a1d24;
      --accent: #00e5ff;
      --text: #e0e6ed;
      --oled-bg: #000000;
      --oled-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-weight: 600;
      font-size: 24px;
      margin-bottom: 2rem;
      color: var(--text);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }

    .device {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .device-title {
      font-size: 14px;
      color: #8892b0;
      margin-bottom: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      width: 100%;
      text-align: left;
    }

    .oled-screen {
      width: 256px;
      height: 128px;
      background: var(--oled-bg);
      border: 2px solid #333;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
      color: var(--oled-text);
      image-rendering: pixelated;
    }

    canvas#oledCanvas {
      width: 100%;
      height: 100%;
    }

    .max7219-screen {
      background: #000;
      padding: 15px;
      border-radius: 8px;
      border: 2px solid #222;
      display: flex;
      gap: 8px;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    canvas#maxCanvas {
      width: 600px;
      height: 100px;
      image-rendering: crisp-edges;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    button {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid #444;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.2s;
    }

    button:hover {
      background: #333;
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>

<body>

  <h1>ESP8266 Animation Live Studio</h1>

  <div class="container">
    <div class="device">
      <div class="device-title">OLED DISPLAY (0.96")</div>
      <div class="oled-screen"><canvas id="oledCanvas" width="256" height="128"></canvas></div>
    </div>
    <div class="device">
      <div class="device-title">MAX7219 8-DIGIT TUBE DISPLAY</div>
      <div class="max7219-screen"><canvas id="maxCanvas" width="640" height="120"></canvas></div>
    </div>
    <div class="controls"><button onclick="location.reload()">↺ Restart Simulation</button></div>
  </div>

  <script>
    let running = true;
    const oledCtx = document.getElementById('oledCanvas').getContext('2d');
    function showOLED(title, engTitle, desc) {
      oledCtx.fillStyle = '#000'; oledCtx.fillRect(0, 0, 256, 128);
      oledCtx.fillStyle = '#FFF'; oledCtx.textAlign = 'left'; oledCtx.textBaseline = 'top';
      oledCtx.font = '16px "JetBrains Mono"'; oledCtx.fillText("[ LIVE BROADCAST ]", 4, 4);
      oledCtx.font = 'bold 32px "JetBrains Mono"'; oledCtx.fillText(title, 4, 36);
      oledCtx.font = '16px "JetBrains Mono"'; oledCtx.fillText(engTitle, 4, 76);
      oledCtx.fillText(desc, 4, 102);
    }

    const maxCtx = document.getElementById('maxCanvas').getContext('2d');
    let state = new Array(8).fill(0);
    let globalIntensity = 8;
    const segments = [
      { b: 0x40, p: [[12, 10], [18, 4], [42, 4], [48, 10], [42, 16], [18, 16]] }, { b: 0x20, p: [[48, 12], [54, 18], [54, 42], [48, 48], [42, 42], [42, 18]] },
      { b: 0x10, p: [[48, 52], [54, 58], [54, 82], [48, 88], [42, 82], [42, 58]] }, { b: 0x08, p: [[12, 90], [18, 84], [42, 84], [48, 90], [42, 96], [18, 96]] },
      { b: 0x04, p: [[12, 52], [18, 58], [18, 82], [12, 88], [6, 82], [6, 58]] }, { b: 0x02, p: [[12, 12], [18, 18], [18, 42], [12, 48], [6, 42], [6, 18]] },
      { b: 0x01, p: [[12, 50], [18, 46], [42, 46], [48, 50], [42, 54], [18, 54]] }
    ];

    function drawMax() {
      maxCtx.fillStyle = '#0a0004'; maxCtx.fillRect(0, 0, 640, 120);
      let op = 0.1 + (globalIntensity / 15) * 0.9;
      for (let i = 0; i < 8; i++) {
        let v = state[7 - i], ox = 10 + i * 75, oy = 10;
        segments.forEach(s => {
          maxCtx.beginPath(); s.p.forEach((pt, x) => x === 0 ? maxCtx.moveTo(ox + pt[0], oy + pt[1]) : maxCtx.lineTo(ox + pt[0], oy + pt[1])); maxCtx.closePath();
          maxCtx.fillStyle = v & s.b ? `rgba(255,30,60,${op})` : '#1c0a0e';
          maxCtx.shadowColor = v & s.b ? 'rgba(255,0,50,0.8)' : 'transparent'; maxCtx.shadowBlur = v & s.b ? 10 * op : 0; maxCtx.fill();
        });
        maxCtx.beginPath(); maxCtx.arc(ox + 62, oy + 90, 6, 0, Math.PI * 2);
        maxCtx.fillStyle = v & 0x80 ? `rgba(255,30,60,${op})` : '#1c0a0e'; maxCtx.shadowColor = v & 0x80 ? 'rgba(255,0,50,0.8)' : 'transparent'; maxCtx.shadowBlur = v & 0x80 ? 10 * op : 0; maxCtx.fill();
      }
    }

    const delay = ms => new Promise(r => setTimeout(r, ms));
    function clearState() { state.fill(0); drawMax(); }
    const dMap = [0x7E, 0x30, 0x6D, 0x79, 0x33, 0x5B, 0x5F, 0x70, 0x7F, 0x7B];
    function setD(d, n, dp) { if (d >= 0 && d < 8) state[d] = dMap[n] | (dp ? 0x80 : 0); }
    function setC(d, c, dp) { if (d >= 0 && d < 8) state[d] = (c === ' ' ? 0 : c === 'C' ? 0x4E : 0) | (dp ? 0x80 : 0); }
    async function bb(l, h, dt) { for (let i = l; i <= h; ++i) { globalIntensity = i; drawMax(); await delay(dt); } }
    async function bd(h, l, dt) { for (let i = h; i >= l; --i) { globalIntensity = i; drawMax(); await delay(dt); } }

    async function anim_InitialBootBreathing() {
      clearState();
      for (let i = 0; i < 8; i++) state[i] = 0xFF; drawMax();
      showOLED("AWAKENING", "System Power On", "Warming up LED Matrix...");
      let t = Date.now();
      while (Date.now() - t < 6000) {
        await bb(1, 15, 35);
        await bd(15, 1, 35);
      }
    }

    // 50 animations mapping directly from C++
    async function a01() { let t = Date.now(); while (Date.now() - t < 6000) { clearState(); for (let i = 7; i >= 0; i--) { state[i] |= 0x40; drawMax(); await delay(30); } state[0] |= 0x20; drawMax(); await delay(30); state[0] |= 0x10; drawMax(); await delay(30); for (let i = 0; i <= 7; i++) { state[i] |= 0x08; drawMax(); await delay(30); } state[7] |= 0x04; drawMax(); await delay(30); state[7] |= 0x02; drawMax(); await delay(30); for (let b = 0; b < 2; b++) { clearState(); await delay(100); drawMax(); await delay(100); } } }
    async function a02() { let t = Date.now(); while (Date.now() - t < 6000) { clearState(); for (let i = 7; i >= 0; i--) { state[i] = 0x80; drawMax(); await delay(30); state[i] = 0; } for (let i = 1; i <= 6; i++) { state[i] = 0x80; drawMax(); await delay(30); state[i] = 0; } } }
    async function a03() { const p = [{ d: 7, s: 0x40 }, { d: 6, s: 0x40 }, { d: 5, s: 0x40 }, { d: 4, s: 0x40 }, { d: 3, s: 0x40 }, { d: 2, s: 0x40 }, { d: 1, s: 0x40 }, { d: 0, s: 0x40 }, { d: 0, s: 0x20 }, { d: 0, s: 0x10 }, { d: 0, s: 0x08 }, { d: 1, s: 0x08 }, { d: 2, s: 0x08 }, { d: 3, s: 0x08 }, { d: 4, s: 0x08 }, { d: 5, s: 0x08 }, { d: 6, s: 0x08 }, { d: 7, s: 0x08 }, { d: 7, s: 0x04 }, { d: 7, s: 0x02 }]; let t = Date.now(); while (Date.now() - t < 6000) { for (let i = 0; i < 20; i++) { clearState(); for (let sl = 0; sl < 4; sl++) { let px = p[(i - sl + 20) % 20]; state[px.d] |= px.s; } drawMax(); await delay(25); } } }
    async function a04() { let t = Date.now(); while (Date.now() - t < 6000) { clearState(); for (let i = 0; i < 8; i++)state[i] = 0x40; drawMax(); await delay(50); for (let i = 0; i < 8; i++)state[i] = 0x01; drawMax(); await delay(50); for (let i = 0; i < 8; i++)state[i] = 0x08; drawMax(); await delay(50); for (let i = 0; i < 8; i++)state[i] = 0x01; drawMax(); await delay(50); } }
    async function a05() { let t = Date.now(); while (Date.now() - t < 6000) { for (let i = 0; i <= 3; i++) { clearState(); state[3 - i] = 0x36; state[4 + i] = 0x36; drawMax(); await delay(100); } for (let i = 2; i >= 0; i--) { clearState(); state[3 - i] = 0x36; state[4 + i] = 0x36; drawMax(); await delay(100); } } }
    async function a06() { let s = [0x40, 0x01, 0x08, 0x01], t = Date.now(), st = 0; while (Date.now() - t < 6000) { clearState(); for (let i = 0; i < 8; i++)state[7 - i] = s[(st + i) % 4]; drawMax(); await delay(50); st++; } }
    async function a07() { let p = [0x80, 0x80, 0x01, 0x40, 0x08], t = Date.now(); while (Date.now() - t < 6000) { clearState(); for (let j = 0; j < 15; j++) { state[~~(Math.random() * 8)] ^= p[~~(Math.random() * 5)]; drawMax(); await delay(40); } } }
    async function a08() { let o = [0x78, 0x48, 0x48, 0x48, 0x48, 0x48, 0x48, 0x4E], m = [0, 0x78, 0x48, 0x48, 0x48, 0x48, 0x4E, 0], i = [0, 0, 0, 0x78, 0x4E, 0, 0, 0]; let t = Date.now(); while (Date.now() - t < 6000) { clearState(); for (let x = 0; x < 8; x++)state[x] = i[x]; drawMax(); await delay(150); clearState(); for (let x = 0; x < 8; x++)state[x] = m[x]; drawMax(); await delay(150); clearState(); for (let x = 0; x < 8; x++)state[x] = o[x]; drawMax(); await delay(150); clearState(); for (let x = 0; x < 8; x++)state[x] = m[x]; drawMax(); await delay(150); } }
    async function a09() { let t = Date.now(); while (Date.now() - t < 6000) { for (let i = 7; i >= 0; i--) { clearState(); state[i] = 0x40; drawMax(); await delay(30); state[i] = 0x01; drawMax(); await delay(30); state[i] = 0x08; drawMax(); await delay(30); state[i] = 0x80; drawMax(); await delay(60); } } }
    async function a10() { let t = Date.now(); while (Date.now() - t < 6000) { clearState(); for (let i = 7; i >= 0; i--) { state[i] |= 0x40; drawMax(); await delay(20); state[i] |= 0x01; drawMax(); await delay(20); state[i] |= 0x08; drawMax(); await delay(20); } for (let i = 0; i <= 7; i++) { state[i] &= ~0x08; drawMax(); await delay(20); state[i] &= ~0x01; drawMax(); await delay(20); state[i] &= ~0x40; drawMax(); await delay(20); } } }
    async function a11() { let s = [0x40, 0x20, 0x10, 0x08, 0x04, 0x02], t = Date.now(), st = 0; while (Date.now() - t < 6000) { for (let i = 0; i < 8; i++)state[i] = s[(st + i) % 6]; drawMax(); await delay(35); st++; } }
    async function a12() { let t = Date.now(); while (Date.now() - t < 6000) { clearState(); for (let i = 7; i >= 0; i--) { state[i] = 0x08; drawMax(); await delay(30); state[i] |= 0x80; drawMax(); await delay(60); } for (let i = 7; i >= 0; i--) { state[i] = 0; drawMax(); await delay(20); } } }
    async function a13() { let t = Date.now(), pos = 7; while (Date.now() - t < 6000) { clearState(); for (let i = 0; i < 8; i++)state[i] = 0x08; state[pos] = 0x49; if (pos > 0) state[pos - 1] = 0x01; drawMax(); await delay(80); pos--; if (pos < 0) { pos = 7; await delay(300); } } }
    async function a14() { let t = Date.now(), pos = 7, op = 1; while (Date.now() - t < 6000) { clearState(); for (let i = 0; i < pos; i++)state[i] = 0x80; state[pos] = op ? 0x4E : 0x4F; drawMax(); op = !op; await delay(150); pos--; if (pos < 0) { pos = 7; await delay(500); } } }
    async function a15() { let l = [0x00, 0x08, 0x09, 0x49], t = Date.now(); while (Date.now() - t < 6000) { for (let i = 0; i < 8; i++)state[i] = l[~~(Math.random() * 4)]; drawMax(); await delay(80); } }
    async function a16() { let t = Date.now(), lk = 8; while (Date.now() - t < 6000) { for (let i = 0; i < lk; i++)state[i] = ~~(Math.random() * 256) | 1; drawMax(); await delay(40); if (Math.random() > 0.7 && lk > 0) lk--; if (lk === 0) { await delay(800); lk = 8; } } }
    async function a17() { let t = Date.now(), pos = 7; while (Date.now() - t < 6000) { clearState(); state[pos] = 0x08; drawMax(); await delay(150); if (pos > 0) { state[pos - 1] = 0x01; drawMax(); await delay(150); state[pos] = 0; state[pos - 1] = 0x08; drawMax(); await delay(150); } pos--; if (pos < 0) { pos = 7; await delay(300); } } }
    async function a18() { let t = Date.now(); while (Date.now() - t < 6000) { clearState(); state[5] = 0x4A; state[2] = 0x4A; drawMax(); await delay(600); clearState(); state[5] = 0x08; state[2] = 0x08; drawMax(); await delay(120); clearState(); state[5] = 0x62; state[2] = 0x62; drawMax(); await delay(400); clearState(); state[5] = 0x4A; state[2] = 0x4A; drawMax(); await delay(600); clearState(); state[5] = 0x30; state[2] = 0x30; drawMax(); await delay(400); } }
    async function a19() { let t = Date.now(); while (Date.now() - t < 6000) { clearState(); state[7] = 0x01; drawMax(); await delay(150); state[7] = 0x41; drawMax(); await delay(150); state[7] = 0x49; drawMax(); await delay(150); for (let i = 6; i >= 0; i--)state[i] = 0x01; drawMax(); await delay(100); for (let i = 6; i >= 0; i--)state[i] = 0; drawMax(); await delay(100); state[7] = 0; drawMax(); await delay(400); } }
    async function a20() { let t = Date.now(), h = 0; while (Date.now() - t < 6000) { if (h >= 8) { h = 0; await delay(500); continue; } for (let p = 7; p >= h; p--) { clearState(); for (let i = 0; i < h; i++)state[i] = 0xDB; state[p] = 0xDB; drawMax(); await delay(40); } h++; } }
    async function a21() { let s = [0x40, 0x20, 0x10, 0x08, 0x04, 0x02], o = Array(8).fill(0).map(() => ~~(Math.random() * 6)), t = Date.now(), st = 0; while (Date.now() - t < 6000) { for (let i = 0; i < 8; i++)state[i] = s[(st + o[i]) % 6]; drawMax(); await delay(35); st++; } }
    async function a22() { let t = Date.now(); while (Date.now() - t < 6000) { for (let i = 0; i < 8; i++)state[i] = ~~(Math.random() * 256); drawMax(); await delay(200); for (let i = 7; i >= 0; i--) { state[i] = 0xFF; drawMax(); await delay(40); state[i] = 0; } drawMax(); await delay(200); for (let i = 0; i < 8; i++)state[i] = ~~(Math.random() * 256); drawMax(); await delay(200); for (let i = 0; i < 8; i++) { state[i] = 0xFF; drawMax(); await delay(40); state[i] = 0; } } }
    async function a23() { let t = Date.now(); while (Date.now() - t < 6000) { clearState(); state[3] = 0x08; state[4] = 0x08; drawMax(); await delay(120); state[3] = 0x49; state[4] = 0x49; drawMax(); await delay(120); state[2] = 0x08; state[5] = 0x08; drawMax(); await delay(120); state[2] = 0x49; state[5] = 0x49; drawMax(); await delay(120); state[1] = 0x08; state[6] = 0x08; drawMax(); await delay(120); state[1] = 0x49; state[6] = 0x49; drawMax(); await delay(120); state[0] = 0x08; state[7] = 0x08; drawMax(); await delay(120); state[0] = 0x49; state[7] = 0x49; drawMax(); await delay(120); clearState(); await delay(200); } }
    async function a24() { let t = Date.now(); while (Date.now() - t < 6000) { for (let i = 0; i < 8; i++)state[i] = Math.random() > 0.5 ? 0x06 : 0x3F; drawMax(); await delay(120); } }
    async function a25() { let t = Date.now(); while (Date.now() - t < 6000) { clearState(); for (let i = 0; i < 8; i++)state[i] = 0x30; drawMax(); await delay(400); for (let i = 7; i >= 0; i--) { state[i] = 0x08; drawMax(); await delay(80); } await delay(500); } }
    async function a26() { let t = Date.now(), txt = [0x76, 0x79, 0x38, 0x38], len = 0; while (Date.now() - t < 6000) { clearState(); for (let i = 0; i < len; i++)state[7 - i] = txt[i]; if (len < 4) state[7 - len] = (~~(Date.now() / 200)) % 2 === 0 ? 0x08 : 0x00; drawMax(); if (Math.random() > 0.7 && len < 4) len++; if (len === 4 && (Date.now() - t > 5000)) len = 0; await delay(100); } }
    async function a27() { let t = Date.now(); while (Date.now() - t < 6000) { clearState(); for (let i = 0; i < 8; i++)state[i] = 0x40; drawMax(); await delay(800); for (let i = 0; i < 8; i++)state[i] = 0x01; drawMax(); await delay(800); for (let i = 0; i < 8; i++)state[i] = 0x08; drawMax(); await delay(800); } }
    async function a28() { let t = Date.now(), u = 7; while (Date.now() - t < 6000) { clearState(); state[u] = 0x63; state[u] |= (~~(Date.now() / 100)) % 2 ? 0x14 : 0; drawMax(); await delay(120); if (Math.random() > 0.5) u += Math.random() > 0.5 ? 1 : -1; if (u < 1) u = 1; if (u > 7) u = 7; } }
    async function a29() { let t = Date.now(); while (Date.now() - t < 6000) { let loc = ~~(Math.random() * 6) + 1; clearState(); state[loc] = 0x08; drawMax(); await delay(150); state[loc] = 0x01; drawMax(); await delay(150); state[loc] = 0x40; drawMax(); await delay(150); state[loc] = 0xFF; if (loc > 0) state[loc - 1] = 0x55; if (loc < 7) state[loc + 1] = 0x55; drawMax(); await delay(150); state[loc] = 0x49; if (loc > 0) state[loc - 1] = 0x00; if (loc < 7) state[loc + 1] = 0x00; drawMax(); await delay(150); } }
    async function a30() { let t = Date.now(); while (Date.now() - t < 6000) { for (let i = 0; i < 8; i++)state[i] = 0xFF; drawMax(); await delay(30); clearState(); await delay(60); } }
    async function a31() { let t = Date.now(), x = 0, d = 1; while (Date.now() - t < 6000) { clearState(); state[x] = 0x08; drawMax(); await delay(60); x += d; if (x >= 7 || x <= 0) d = -d; } }
    async function a32() { let t = Date.now(), x = 0; while (Date.now() - t < 6000) { clearState(); state[x] = 0xFF; drawMax(); await delay(60); x = (x + 1) % 8; } }
    async function a33() { let t = Date.now(); while (Date.now() - t < 6000) { clearState(); state[3] = 0x48; state[4] = 0x48; drawMax(); await delay(100); clearState(); drawMax(); await delay(50); state[3] = 0x48; state[4] = 0x48; drawMax(); await delay(100); clearState(); drawMax(); await delay(600); } }
    async function a34() { let w = [0x42, 0x24, 0x18, 0x81], t = Date.now(), s = 0; while (Date.now() - t < 6000) { for (let i = 0; i < 8; i++)state[i] = w[(s + i) % 4]; drawMax(); await delay(80); s++; } }
    async function a35() { let t = Date.now(); while (Date.now() - t < 6000) { let r = ~~(Math.random() * 8); state[r] = (state[r] << 1) | (Math.random() > 0.5 ? 1 : 0); drawMax(); await delay(40); } }
    async function a36() { let t = Date.now(); while (Date.now() - t < 6000) { let v = ~~(Math.random() * 5); clearState(); for (let i = 0; i < v; i++) { state[3 - i] = 0x49; state[4 + i] = 0x49; } drawMax(); await delay(100); } }
    async function a37() { let t = Date.now(); while (Date.now() - t < 6000) { state[~~(Math.random() * 8)] ^= (1 << ~~(Math.random() * 8)); drawMax(); await delay(20); } }
    async function a38() { let t = Date.now(), r2 = 0x48, r3 = 0x3F; while (Date.now() - t < 6000) { clearState(); state[3] = r2; state[4] = r2; drawMax(); await delay(150); state[3] = r3; state[4] = r3; state[2] = r2; state[5] = r2; drawMax(); await delay(150); state[2] = r3; state[5] = r3; state[1] = r2; state[6] = r2; drawMax(); await delay(150); } }
    async function a39() { let t = Date.now(), x = 0; while (Date.now() - t < 6000) { clearState(); state[x] |= 0x01; state[7 - x] |= 0x40; drawMax(); await delay(80); x = (x + 1) % 8; } }
    async function a40() { let r = [0x01, 0x02, 0x40, 0x20], t = Date.now(), s = 0; while (Date.now() - t < 6000) { clearState(); for (let i = 0; i < 8; i++)state[i] = r[(s + i) % 4]; drawMax(); await delay(80); s++; } }
    async function a41() { let t = Date.now(), n = 0; while (Date.now() - t < 6000) { clearState(); for (let i = 0; i <= n; i++)state[7 - i] = 0x08; drawMax(); await delay(150); n++; if (n > 7) { n = 0; await delay(300); } } }
